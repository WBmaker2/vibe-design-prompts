name: Publish design prompt gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify gallery behavior
        run: node --test scripts/core.test.cjs
      - name: Check browser scripts
        run: |
          node --check dist/app.js
          node --check dist/data.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static gallery
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy gallery
        id: deployment
        uses: actions/deploy-pages@v4
